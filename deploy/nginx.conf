server {
    listen 80;
    server_name _;
    # ~/fast-admissions is mounted here; `current` is a relative symlink to the live Release.
    root /srv/fast-admissions/current;
    index index.html;
    # Never send the browser to an absolute path: it would drop the /admissions/ prefix.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # File names are not hashed: short cache, so edits show up within the hour.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # One page: anything else shows it. No `$uri/`, so nginx never redirects.
    location / {
        try_files $uri /index.html;
    }
}
